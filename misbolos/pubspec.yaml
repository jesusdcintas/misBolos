name: misbolos
description: "MisBolos - Gestión de bolos, clientes y facturas para DJs"
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.4.2+1
  path: ^1.9.0
  supabase_flutter: ^2.5.3
  pdf: ^3.11.0
  printing: ^5.13.1
  share_plus: ^12.0.0
  image_picker: ^1.1.2
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2
  googleapis: ^13.2.0
  google_sign_in: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.4.0
  path_provider: ^2.1.5
  csv: ^6.0.0
  file_picker: ^11.0.0
  excel: ^4.0.6
  archive: ^3.6.1
  http: ^1.2.0
  crypto: ^3.0.3
  googleapis_auth: ^2.0.0
  url_launcher: ^6.3.2
  confetti: ^0.7.0
  shared_preferences: ^2.2.3
  syncfusion_flutter_pdf: ^29.2.11
  image: ^4.3.0
  local_auth: ^2.3.0
  flutter_localizations:
    sdk: flutter

dependency_overrides:
  # iOS 26.x: evitar crash nativo en el registro del plugin al arrancar.
  path_provider_foundation: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/icon/logo3.png"
  image_path: "assets/icon/logo3.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/logo3.png"
  windows:
    generate: true
    image_path: "assets/icon/logo3.png"

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/fonts/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
